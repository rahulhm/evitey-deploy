name: Sync to new code

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source repository
      uses: actions/checkout@v3
    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Mirror push to target repository
      #env:
      #  GIT_USER: rahulhm
      #  GIT_TOKEN: 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
      run: |
        git remote add target https://rahulhm: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@github.com/rahulhm/evitey-deploy.git
        git push --mirror target
